<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>הרשמה | PLAYIT</title>

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geom:wght@300;400;700&family=IBM+Plex+Sans+Hebrew:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>

<!-- HEADER -->
<header class="main-header">
    <h1 class="logo">🎮 PLAYIT</h1>
</header>

<!-- SIGNUP FORM -->
<main class="auth-container">
    <h2 class="auth-title">יצירת משתמש חדש</h2>

    <form id="registerForm" class="auth-form">

        <label>שם מלא:
            <input type="text" id="fullName" required>
        </label>

        <label>אימייל:
            <input type="email" id="regEmail" required>
        </label>

        <label>סיסמה:
            <input type="password" id="regPassword" required>
        </label>

        <button type="submit" class="btn auth-btn">הרשמה</button>

        <p class="link">כבר רשומים? <a href="login.html">לכניסה</a></p>
    </form>
</main>

<!-- FOOTER -->
<footer>
    <p>כל הזכויות שמורות © PLAYIT 2025</p>
</footer>
<script src="js/signup.js"></script>
</body>
</html>
